name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
  STACK_NAME: deputy-mcp

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build deployment package
        run: |
          mkdir -p build
          pip install -r requirements.txt -t build/ \
            --platform manylinux2014_aarch64 \
            --python-version 3.12 --only-binary=:all:
          cp src/*.py build/
          cd build && zip -qr ../package.zip .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload artifact
        run: |
          KEY="builds/${{ github.sha }}.zip"
          aws s3 cp package.zip "s3://${{ vars.ARTIFACT_BUCKET }}/${KEY}"
          echo "ARTIFACT_KEY=${KEY}" >> "$GITHUB_ENV"

      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --template-file infra/template.yaml \
            --stack-name "$STACK_NAME" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              "ArtifactBucket=${{ vars.ARTIFACT_BUCKET }}" \
              "ArtifactKey=${ARTIFACT_KEY}" \
              "DeputyClientId=${{ secrets.DEPUTY_CLIENT_ID }}" \
              "DeputyClientSecret=${{ secrets.DEPUTY_CLIENT_SECRET }}"

      - name: Show outputs
        run: |
          aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs" --output table
